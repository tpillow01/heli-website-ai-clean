<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Tynan Equipment AI</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />

  <link rel="stylesheet" href="{{ url_for('static', filename='styles.css') }}?v=aimemory2">

  <link
    href="https://fonts.googleapis.com/css2?family=Exo+2:wght@800;900&display=swap"
    rel="stylesheet"
  >

  <link rel="manifest" href="{{ url_for('static', filename='manifest.json') }}">
  <meta name="theme-color" content="#efe4d0">

  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('/service-worker.js')
          .then(r => console.log('SW:', r.scope))
          .catch(e => console.error('SW failed:', e));
      });
    }
  </script>
</head>

<body>
  <div class="chat-container">

    <div class="topbar">
      <div class="brand">
        <span class="accent">Tynan</span> Equipment AI
      </div>

      <div class="topbar-right">
        <span
          class="heli-text"
          style="font-family:'Exo 2', sans-serif; letter-spacing:1px;"
        >
          HELI
        </span>
      </div>
    </div>

    <div class="navbar">
      <button class="menu-btn" aria-label="Menu"></button>

      <nav class="tabs">
        <a href="#" class="tab active">Chat</a>

        <a href="{{ url_for('map_page') }}" class="tab">
          Map
        </a>

        <a href="{{ url_for('daily_activity.dashboard') }}" class="tab">
          Daily Activity
        </a>

        <a
          href="/battlecards"
          class="tab {{ 'active' if request.path.startswith('/battlecards') else '' }}"
        >
          Battle Cards
        </a>

        <a href="{{ url_for('quote_request') }}" class="tab">
          Quote Request
        </a>

        <a href="{{ url_for('logout') }}" class="tab">
          Logout
        </a>
      </nav>

      <div class="nav-actions">
        <div class="mode-wrap">
          <span class="mode-label">Mode</span>

          <select
            id="modeSelect"
            class="mode-select"
            aria-label="Chat Mode"
          >
            <option value="recommendation">
              Forklift Recommendation
            </option>

            <option value="options_attachments">
              Options &amp; Attachments
            </option>

            <option value="inquiry">
              Customer Inquiry (Billing)
            </option>

            <option value="contact_finder">
              Contact Finder
            </option>

            <option value="indiana_developments">
              Indiana Developments
            </option>

            <option value="coach">
              Sales Coach
            </option>
          </select>
        </div>
      </div>
    </div>

    <div class="stage">

      <div
        class="forklift-animation"
        id="forklift-animation"
        aria-hidden="true"
      >
        <div class="forklift-unit">
          <img
            src="{{ url_for('static', filename='forklift_heli.png') }}"
            alt="Forklift"
            class="forklift-img"
          >
        </div>
      </div>

      <div
        id="response-area"
        class="response-area"
        role="log"
        aria-live="polite"
      ></div>
    </div>

    <form id="chat-form" class="input-form">
      <label for="userInput" class="sr-only">
        Your message
      </label>

      <textarea
        id="userInput"
        rows="3"
        placeholder="Enter a message..."
        required
        autofocus
      ></textarea>

      <button
        type="submit"
        class="send-btn"
        aria-label="Send message"
      >
        ➤
      </button>
    </form>

    <div class="footer">
      Powered by Tynan Equipment AI
    </div>
  </div>

  <script>
    const form = document.getElementById('chat-form');
    const input = document.getElementById('userInput');
    const responseArea = document.getElementById('response-area');
    const forkliftAnim = document.getElementById('forklift-animation');
    const forkliftUnit = forkliftAnim.querySelector('.forklift-unit');
    const modeSelect = document.getElementById('modeSelect');

    /*
     * Each chat mode gets its own short conversation history.
     * This prevents Customer Inquiry messages from interfering
     * with Forklift Recommendation messages.
     */
    const historyByMode = Object.create(null);

    let animationInterval;
    let isForward = true;
    let requestInProgress = false;

    function escapeHtml(value) {
      return String(value ?? '')
        .replaceAll('&', '&amp;')
        .replaceAll('<', '&lt;')
        .replaceAll('>', '&gt;')
        .replaceAll('"', '&quot;')
        .replaceAll("'", '&#039;');
    }

    function formatLabels(text) {
      return text.replace(
        /(Customer Profile:|Model:|Power:|Capacity:|Tire Type:|Tires \(recommended\):|Attachments \(relevant\):|Options \(relevant\):|Attachments:|Options:|Comparison:|Sales Pitch Techniques:|Common Objections:|Current Promotions:|Segmentation:|Top Months:|Top Offerings:|Billing:|By Offering \(R12-ish\):|Visit Focus Suggestions:|Next-Level Actions:)/g,
        '<span class="section-label">$1</span>'
      );
    }

    /*
     * Allows the limited HTML used by certain responses while
     * removing unwanted HTML elements and attributes.
     */
    function sanitizeServerHtml(source) {
      const template = document.createElement('template');

      template.innerHTML = String(source ?? '');

      const allowedTags = new Set([
        'A',
        'BR',
        'DIV',
        'EM',
        'P',
        'SPAN',
        'STRONG',
        'UL',
        'OL',
        'LI'
      ]);

      for (const node of [
        ...template.content.querySelectorAll('*')
      ]) {
        if (!allowedTags.has(node.tagName)) {
          node.replaceWith(
            document.createTextNode(node.textContent || '')
          );

          continue;
        }

        for (const attr of [...node.attributes]) {
          const attributeName = attr.name.toLowerCase();

          const keepHref =
            node.tagName === 'A' &&
            attributeName === 'href';

          const keepClass =
            attributeName === 'class';

          const keepStyle =
            node.tagName === 'SPAN' &&
            attributeName === 'style';

          if (!keepHref && !keepClass && !keepStyle) {
            node.removeAttribute(attr.name);
          }
        }

        if (node.tagName === 'A') {
          const href = node.getAttribute('href') || '';

          if (
            !/^https?:\/\//i.test(href) &&
            !/^mailto:/i.test(href)
          ) {
            node.removeAttribute('href');
          }

          node.setAttribute('rel', 'noopener noreferrer');
          node.setAttribute('target', '_blank');
        }
      }

      return template.innerHTML;
    }

    function renderBubble(textOrHtml, sender = 'ai') {
      if (sender === 'ai') {
        stopAnimation();
      }

      const bubble = document.createElement('div');

      bubble.className = `response-bubble ${sender}`;

      const value = String(textOrHtml ?? '');

      const looksLikeHtml =
        /<\s*\w+[^>]*>/.test(value);

      if (sender === 'ai' && looksLikeHtml) {
        bubble.innerHTML = sanitizeServerHtml(value);
      } else {
        bubble.innerHTML = formatLabels(escapeHtml(value))
          .split('\n')
          .map(line => {
            return `<div>${line || '&nbsp;'}</div>`;
          })
          .join('');
      }

      responseArea.appendChild(bubble);

      bubble.scrollIntoView({
        behavior: 'smooth',
        block: 'end'
      });
    }

    function startAnimationLoop() {
      forkliftAnim.style.display = 'block';
      forkliftUnit.style.left = '0';

      isForward = true;

      clearInterval(animationInterval);

      animationInterval = setInterval(
        animateForklift,
        2000
      );
    }

    function animateForklift() {
      const distance =
        `calc(100% - ${forkliftUnit.offsetWidth}px)`;

      forkliftUnit.style.left =
        isForward ? distance : '0';

      isForward = !isForward;
    }

    function stopAnimation() {
      clearInterval(animationInterval);
      forkliftAnim.style.display = 'none';
    }

    function historyFor(mode) {
      if (!historyByMode[mode]) {
        historyByMode[mode] = [];
      }

      return historyByMode[mode];
    }

    function remember(mode, role, content) {
      const history = historyFor(mode);

      history.push({
        role: role,
        content: String(content ?? '').slice(0, 1600)
      });

      /*
       * Keep only the latest eight messages so requests do not
       * become excessively large.
       */
      if (history.length > 8) {
        history.splice(
          0,
          history.length - 8
        );
      }
    }

    async function readApiResponse(response) {
      let data;

      try {
        data = await response.json();
      } catch (_) {
        throw new Error(
          `The server returned an unreadable response (HTTP ${response.status}).`
        );
      }

      if (!response.ok) {
        throw new Error(
          data.error ||
          data.message ||
          `HTTP ${response.status}`
        );
      }

      return (
        data.html ||
        data.response ||
        data.text ||
        data.message ||
        '(no response)'
      );
    }

    async function askOptionsAttachments(
      userText,
      history
    ) {
      const response = await fetch(
        '/api/options_attachments_chat',
        {
          method: 'POST',

          headers: {
            'Content-Type': 'application/json'
          },

          body: JSON.stringify({
            q: userText,
            history: history
          })
        }
      );

      return readApiResponse(response);
    }

    async function askGeneralChat(
      userText,
      mode,
      history
    ) {
      const response = await fetch('/api/chat', {
        method: 'POST',

        headers: {
          'Content-Type': 'application/json'
        },

        body: JSON.stringify({
          question: userText,
          mode: mode,
          history: history
        })
      });

      return readApiResponse(response);
    }

    form.addEventListener(
      'submit',
      async event => {
        event.preventDefault();

        if (requestInProgress) {
          return;
        }

        const question = input.value.trim();

        if (!question) {
          return;
        }

        const mode =
          modeSelect.value || 'recommendation';

        /*
         * Copy the history before adding the newest question.
         * The question is sent separately in the API request.
         */
        const priorHistory =
          historyFor(mode).slice(-8);

        requestInProgress = true;
        input.disabled = true;

        renderBubble(question, 'user');

        input.value = '';

        startAnimationLoop();

        try {
          let answer;

          if (mode === 'options_attachments') {
            answer = await askOptionsAttachments(
              question,
              priorHistory
            );
          } else {
            answer = await askGeneralChat(
              question,
              mode,
              priorHistory
            );
          }

          remember(
            mode,
            'user',
            question
          );

          /*
           * Remove HTML tags before storing the answer in
           * conversation memory.
           */
          remember(
            mode,
            'assistant',
            answer.replace(/<[^>]+>/g, ' ')
          );

          renderBubble(answer, 'ai');
        } catch (error) {
          stopAnimation();

          renderBubble(
            `Error: ${error.message}`,
            'ai'
          );
        } finally {
          requestInProgress = false;
          input.disabled = false;
          input.focus();
        }
      }
    );

    /*
     * Enter sends the message.
     * Shift + Enter creates a new line.
     */
    input.addEventListener(
      'keydown',
      event => {
        if (
          event.key === 'Enter' &&
          !event.shiftKey
        ) {
          event.preventDefault();
          form.requestSubmit();
        }
      }
    );
  </script>
</body>
</html>
